name: Deploy Production (Manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite DEPLOY_PRODUCTION somente após DEV homologado'
        required: true
        type: string

jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Production deployment gate
        shell: bash
        run: |
          if [[ "${{ inputs.confirmation }}" != "DEPLOY_PRODUCTION" ]]; then
            echo "Production deployment blocked. DEV must be homologated first."
            exit 1
          fi
          echo "Explicit production confirmation received."

      - name: Production infrastructure status
        run: |
          echo "Production deploy remains intentionally incomplete until Neon Auth PROD, production domain/CORS and production database secrets are configured." 
          exit 1
