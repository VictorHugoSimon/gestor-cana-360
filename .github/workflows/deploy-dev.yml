name: Deploy DEV Cloudflare

on:
  push:
    branches: [develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DEV }}
      VITE_NEON_AUTH_URL: https://ep-dawn-rain-ac4fpv5q.neonauth.sa-east-1.aws.neon.tech/gestor_cana_360/auth
      VITE_API_URL: ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect deploy credentials
        id: preflight
        shell: bash
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" && -n "$DATABASE_URL" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare DEV credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DEV deploy skipped: configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and NEON_DATABASE_URL_DEV."
          fi

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        if: steps.preflight.outputs.ready == 'true'
        run: pnpm typecheck

      - name: Build React assets
        if: steps.preflight.outputs.ready == 'true'
        run: pnpm --filter @gc360/web build

      - name: Deploy unified DEV Worker
        if: steps.preflight.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env dev
          packageManager: pnpm
          secrets: |
            DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DEV }}

      - name: Deployment summary
        if: steps.preflight.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "## Gestor Cana 360 DEV" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy concluído: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
